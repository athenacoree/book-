<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d1b"><title>ZOOM · Actualizador</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#243d66,#090d1b 70%);color:#f4f7ff;font-family:system-ui;text-align:center;padding:24px}.box{max-width:420px;width:100%;padding:28px;border:1px solid #ffffff25;border-radius:24px;background:#ffffff0c;box-shadow:0 20px 60px #0007}.logo{font-size:72px;font-weight:1000;letter-spacing:-5px;background:linear-gradient(110deg,#fff,#63e8ff,#ff75bc);background-clip:text;color:transparent}.bar{height:7px;border-radius:8px;background:#ffffff20;overflow:hidden;margin:20px 0}.bar i{display:block;height:100%;width:30%;background:#63e8ff;animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{width:95%}}p{color:#b8c8e6;line-height:1.5;font-size:14px}</style></head><body><div class="box"><div class="logo">ZOOM</div><b id="status">Comprobando la campaña…</b><div class="bar"><i></i></div><p id="detail">Buscando mejoras y preparando tu aventura.</p></div><script>
(async()=>{const KEY='zoom:cachedGameHtml',VER='zoom:cachedVersion',manifestUrl='https://raw.githubusercontent.com/athenacoree/book-/main/games/zoom/version.json';let cached='';try{cached=localStorage.getItem(KEY)||''}catch(e){}function launch(html){document.open();document.write(html);document.close()}if(cached){launch(cached);setTimeout(check,1200)}else await check();async function check(){try{let r=await fetch(manifestUrl+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('manifest');let m=await r.json(),old=localStorage.getItem(VER)||'0';if(m.version!==old){document.getElementById('status').textContent='Descargando actualización '+m.version;let g=await fetch(m.file+'?v='+Date.now(),{cache:'no-store'});if(!g.ok)throw Error('game');let html=await g.text();if(!/^<!doctype html|^<html/i.test(html.trim()))throw Error('invalid');localStorage.setItem(KEY,html);localStorage.setItem(VER,m.version);launch(html)}else if(!cached){throw Error('empty cache')}else{document.getElementById('status').textContent='ZOOM está actualizado';launch(cached)}}catch(e){let backup=localStorage.getItem(KEY);if(backup)launch(backup);else{document.getElementById('status').textContent='No se pudo conectar';document.getElementById('detail').textContent='Conéctate a internet la primera vez para descargar la campaña. Después podrás jugar con la última versión guardada.'}}}})();
</script></body></html>
