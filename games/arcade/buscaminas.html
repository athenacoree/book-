<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Buscaminas · GITBOOK ARCADE</title><style>
:root{--accent:#ff9b80;--bg:#0b1020;--panel:#151e34;--line:#293955;--muted:#9aabc7}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#263a5a 0%,#10182a 42%,#090e1b 100%);color:#f5f7ff;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);touch-action:pan-y}.app{width:min(100%,620px);display:flex;flex-direction:column;gap:14px;padding:16px 0 26px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:11px;letter-spacing:2.4px;font-weight:900;color:var(--accent)}.tag{font-size:10px;color:#c7d5eb;border:1px solid #ffffff20;background:#ffffff0b;border-radius:99px;padding:7px 10px}.hero{padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#ffffff13,#ffffff04);box-shadow:0 18px 50px #0004;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-80px;border-radius:50%;background:var(--accent);filter:blur(80px);opacity:.22}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:900}.hero h1{font-size:clamp(28px,7vw,42px);letter-spacing:-1.8px;line-height:1;margin:10px 0}.hero p{color:#b4c3dc;font-size:13px;line-height:1.55;margin:0;max-width:420px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:12px 14px;background:#ffffff09;border:1px solid #ffffff15;border-radius:15px}.stat small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.4px}.stat b{display:block;font-size:18px;margin-top:3px}.gamebox{padding:14px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,#19243b,#10182a);box-shadow:0 22px 60px #0005;min-height:250px}.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:10px;letter-spacing:1.3px}.gamearea{display:grid;place-items:center;min-height:220px;touch-action:pan-y}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.actions button,.extra button{border:1px solid #ffffff22;background:linear-gradient(135deg,#283a57,#19263e);color:#f5f7ff;border-radius:13px;padding:11px 15px;font-weight:750;font-size:12px}.actions button.primary{background:var(--accent);color:#101827;border-color:transparent}.foot{text-align:center;color:#7384a2;font-size:10px;line-height:1.5}
.tiles{width:min(100%,360px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#0b1221;padding:8px;border-radius:18px}.tile{aspect-ratio:1;border-radius:12px;background:#24334d;display:grid;place-items:center;font-size:clamp(17px,5vw,26px);font-weight:900;color:#fff;animation:pop .18s ease}.t0{background:#17243a}.t2{background:#dce9f0;color:#233247}.t4{background:#b8d9d8;color:#233247}.t8{background:#83cdb8;color:#102b2a}.t16{background:#62b6b2}.t32{background:#5596b8}.t64{background:#5476bb}.t128,.t256,.t512,.t1024,.t2048{background:linear-gradient(135deg,var(--accent),#fff2b3);color:#162035}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(100%,330px)}.cell{aspect-ratio:1;border:1px solid #ffffff18;border-radius:17px;background:#0d1729;color:var(--accent);font-size:clamp(38px,12vw,58px);font-weight:900}.cell.o{color:#8ad8ff}.cell:active{transform:scale(.96)}
.memory{width:min(100%,370px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memorycard{aspect-ratio:1;border:1px solid #ffffff20;border-radius:14px;background:linear-gradient(145deg,#29395a,#17243d);color:#dbe6ff;font-size:clamp(22px,6vw,34px);font-weight:900}.memorycard.flipped{background:linear-gradient(145deg,var(--accent),#f5e8ff);color:#17223a;animation:pop .2s}
.simon{width:min(100%,330px);display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pad{aspect-ratio:1;border:3px solid #ffffff20;border-radius:25px;opacity:.75}.pad.coral{background:#d95772}.pad.mint{background:#42b99c}.pad.blue{background:#4c85d9}.pad.gold{background:#d9a83f}.pad.lit{opacity:1;filter:brightness(1.7);box-shadow:0 0 35px currentColor;transform:scale(.97)}
#flight{width:min(100%,360px);height:auto;border-radius:16px;border:1px solid #ffffff22;touch-action:manipulation}.flighttip{color:var(--accent);font-size:10px;letter-spacing:2px;margin-top:8px}
.minefield{width:min(100%,350px);display:grid;grid-template-columns:repeat(9,1fr);gap:3px}.mine{aspect-ratio:1;min-width:0;border:1px solid #ffffff17;border-radius:6px;background:#344766;color:#fff;font-weight:900;font-size:clamp(11px,3vw,16px);padding:0}.mine.revealed{background:#111c30;border-color:#293b59;color:var(--accent)}
.sub{color:var(--muted);font-size:11px;text-align:center}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f4f7ff;color:#152239;border-radius:99px;padding:12px 18px;font-size:12px;font-weight:900;box-shadow:0 12px 40px #0008;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{transform:scale(.86);opacity:.5}to{transform:scale(1);opacity:1}}
@media(max-width:390px){.hero{padding:18px}.gamebox{padding:10px}.app{gap:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand">GITBOOK / ARCADE</div><div class="tag">CAMPO DE LÓGICA</div></header><section class="hero"><div class="eyebrow">ARCADE COLLECTION · CAMPO DE LÓGICA</div><h1>Buscaminas</h1><p>Descubre las casillas seguras, marca las minas y despeja el tablero.</p></section><section class="stats"><div class="stat"><small id="label1">ESTADO</small><b id="value1">LISTO</b></div><div class="stat"><small id="label2">OBJETIVO</small><b id="value2">¡A JUGAR!</b></div></section><section class="gamebox"><div class="gamehead"><span>ÁREA DE JUEGO</span><span>TOCA · JUEGA · SUPERA</span></div><div class="gamearea" id="area"></div></section><div class="actions"><button class="primary" id="restart">Nueva partida</button><button id="sound">♫ Sonido</button><button id="help">Cómo jugar</button></div><div class="extra actions" id="extra"></div><div class="foot">Progreso local · Optimizado para pantalla táctil<br>GITBOOK ARCADE</div></main><div class="toast" id="toast"></div><script>
const area=document.getElementById('area');let muted=false,audio=null;function tone(f=420,d=.08){if(muted||window.__luminaMuted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function hud(a,b,c,d){document.getElementById('label1').textContent=a;document.getElementById('value1').textContent=b;document.getElementById('label2').textContent=c;document.getElementById('value2').textContent=d}function controls(labels,values,fn){let e=document.getElementById('extra');e.innerHTML=labels.map((x,i)=>'<button data-v="'+values[i]+'">'+x+'</button>').join('');e.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>fn(b.dataset.v))}function extra(html){document.getElementById('extra').innerHTML=html}function swipe(fn){let x=0,y=0;area.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});area.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.max(Math.abs(dx),Math.abs(dy))>25)fn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))},{passive:true})}

let size=9,mines=10,grid=[],revealed=[],flags=[],started=false,ended=false;function setup(){grid=Array.from({length:size*size},()=>0);revealed=[];flags=[];started=false;ended=false;let n=0;while(n<mines){let i=Math.random()*grid.length|0;if(grid[i]!==-1){grid[i]=-1;n++}}grid.forEach((v,i)=>{if(v===-1)return;let x=i%size,y=i/size|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<size&&ny<size&&grid[ny*size+nx]===-1)grid[i]++}});draw()}
function draw(){area.innerHTML='<div class="minefield">'+grid.map((v,i)=>'<button class="mine '+(revealed.includes(i)?'revealed':'')+'" data-i="'+i+'">'+(revealed.includes(i)?(v===-1?'✹':v||''):(flags.includes(i)?'⚑':''))+'</button>').join('')+'</div>';area.querySelectorAll('[data-i]').forEach(x=>{x.onclick=()=>reveal(+x.dataset.i);x.oncontextmenu=e=>{e.preventDefault();flag(+x.dataset.i)}});hud('MINAS',mines-flags.length,'SEGURAS',revealed.length+'/'+(size*size-mines))}
function flag(i){if(ended||revealed.includes(i))return;flags=flags.includes(i)?flags.filter(x=>x!==i):[...flags,i];draw()}
function reveal(i){if(ended||flags.includes(i)||revealed.includes(i))return;if(!started)started=true;revealed.push(i);if(grid[i]===-1){ended=true;grid.forEach((v,j)=>{if(v===-1&&!revealed.includes(j))revealed.push(j)});toast('Has encontrado una mina · reinicia para otra partida')}else if(grid[i]===0){let x=i%size,y=i/size|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let nx=x+dx,ny=y+dy,j=ny*size+nx;if(nx>=0&&ny>=0&&nx<size&&ny<size&&!revealed.includes(j))reveal(j)}}if(revealed.length>=size*size-mines){ended=true;toast('¡Campo despejado!')}draw()}setup();
document.getElementById('restart').onclick=()=>{tone(500);location.reload()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'♫ Silencio':'♫ Sonido';if(!muted)tone(650)};document.getElementById('help').onclick=()=>toast("Descubre las casillas seguras, marca las minas y despeja el tablero.");window.addEventListener('lumina:mute',e=>{});
</script></body></html>
