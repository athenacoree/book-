</style></head><body><div id="app">
<header class="top"><div class="brand"><div class="sigil">✧</div><div><b>ECOS DE AETHER</b><small>LA CRIPTA DE LAS 12 LUCES</small></div></div><div><button id="mapBtn">▦ MAPA</button> <button id="pauseBtn">Ⅱ</button> <button id="soundBtn">♫</button></div></header>

<main class="stage"><canvas id="game" width="900" height="600"></canvas><div class="hint">WASD / flechas · ✧ pulso de luz</div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div></main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)},cv=$('game'),c=cv.getContext('2d'),W=900,H=600,C=25,R=17,T=34,OX=25,OY=11,saveKey='aether_crypt_v1';
var biomes=[{name:'Catacumbas de Ámbar',floor:'#171c2c',wall:'#34374d',glow:'#ffc86b',desc:'Ecos antiguos despiertan bajo la piedra.'},{name:'Jardines de Cristal',floor:'#10232d',wall:'#24505a',glow:'#9af4e6',desc:'La luz crece entre raíces luminosas.'},{name:'Observatorio del Vacío',floor:'#211832',wall:'#48356b',glow:'#d2b4ff',desc:'Las estrellas guardan el último secreto.'}];
var s={screen:'title',level:1,score:0,best:0,unlocked:1,total:0,up:{step:0,pulse:0,heart:0},muted:!!(window.LuminaBook&&window.LuminaBook.isMuted()),paused:false};
var map=[],seen=[],items=[],foes=[],traps=[],player={x:1,y:1,hp:3,shards:0,cd:0,inv:0,pulse:0},exit={x:23,y:15},guardian=null,keys={},time=0,last=0,toastTimer=0,audio=null,showMap=false,particles=[];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rng(seed){var x=seed|0;return function(){x=(x+0x6D2B79F5)|0;var t=Math.imul(x^x>>>15,1|x);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function sound(f,d){if(s.muted||window.__luminaMuted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function save(){var d={level:s.level,score:s.score,best:s.best,unlocked:s.unlocked,total:s.total,up:s.up};try{localStorage.setItem(saveKey,JSON.stringify(d));if(window.LuminaGameBridge&&window.LuminaGameBridge.syncSaveState)window.LuminaGameBridge.syncSaveState(JSON.stringify(d),'Nivel '+s.level)}catch(e){}}
function load(){try{var raw=localStorage.getItem(saveKey)||'{}';if((raw==='{}'||!raw)&&window.LuminaGameBridge&&window.LuminaGameBridge.getInitialSaveJson)raw=window.LuminaGameBridge.getInitialSaveJson()||'{}';var d=JSON.parse(raw);s.level=clamp(+d.level||1,1,12);s.score=+d.score||0;s.best=+d.best||0;s.unlocked=clamp(+d.unlocked||1,1,12);s.total=+d.total||0;s.up=Object.assign(s.up,d.up||{})}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').classList.remove('show')},1600)}
function dialog(html){$('overlay').classList.remove('hidden');$('dialog').innerHTML=html}
function hide(){ $('overlay').classList.add('hidden') }
function hud(){$('hearts').textContent=Array(player.hp+1).join('♥ ')||'—';$('hpbar').style.width=(player.hp/(3+s.up.heart)*100)+'%';$('shards').textContent=player.shards+' / 3';$('shardbar').style.width=(player.shards/3*100)+'%';$('score').textContent=String(s.level).padStart(2,'0')+' · '+String(s.score).padStart(4,'0')}
function maze(n){var m=Array.from({length:R},function(){return Array(C).fill(1)}),st=[[1,1]],rr=rng(7817+n*1297);m[1][1]=0;while(st.length){var p=st[st.length-1],dirs=[[0,-2],[2,0],[0,2],[-2,0]].sort(function(){return rr()-.5}),found=false;for(var d of dirs){var x=p[0]+d[0],y=p[1]+d[1];if(x>0&&y>0&&x<C-1&&y<R-1&&m[y][x]){m[p[1]+d[1]/2][p[0]+d[0]/2]=0;m[y][x]=0;st.push([x,y]);found=true;break}}if(!found)st.pop()}for(var y=2;y<R-2;y+=4)for(var x=2;x<C-2;x+=4)if(rr()<.55){if(m[y][x+1])m[y][x+1]=0;if(m[y+1][x])m[y+1][x]=0}return m}
function distances(){var d=Array.from({length:R},function(){return Array(C).fill(999)}),q=[[1,1]];d[1][1]=0;for(var i=0;i<q.length;i++){var p=q[i];for(var v of [[0,-1],[1,0],[0,1],[-1,0]]){var x=p[0]+v[0],y=p[1]+v[1];if(x>0&&y>0&&x<C-1&&y<R-1&&!map[y][x]&&d[y][x]===999){d[y][x]=d[p[1]][p[0]]+1;q.push([x,y])}}}return d}
function newLevel(n){s.level=n;s.unlocked=Math.max(s.unlocked,n);map=maze(n);seen=Array.from({length:R},function(){return Array(C).fill(false)});var d=distances(),cells=[];for(var y=1;y<R-1;y++)for(var x=1;x<C-1;x++)if(!map[y][x]&&d[y][x]>7)cells.push({x:x,y:y,dist:d[y][x]});cells.sort(function(a,b){return b.dist-a.dist});var rr=rng(9173+n*67),used=[];function pick(){var a=cells.filter(function(p){return !used.some(function(q){return Math.abs(q.x-p.x)+Math.abs(q.y-p.y)<4})});var p=a[Math.floor(rr()*a.length)]||cells[0];used.push(p);return p}
exit=pick();items=[];for(var i=0;i<3;i++){var q=pick();items.push({x:q.x,y:q.y,type:'shard',phase:rr()*6})}var q=pick();items.push({x:q.x,y:q.y,type:'heart'});q=pick();items.push({x:q.x,y:q.y,type:'spark'});foes=[];for(var i=0;i<Math.min(1+Math.floor(n/2),5);i++){q=pick();foes.push({x:q.x,y:q.y,cd:0,speed:Math.max(.24,.72-n*.026),stun:0})}traps=[];for(var i=0;i<Math.min(3+Math.floor(n/2),8);i++){q=pick();traps.push({x:q.x,y:q.y,phase:rr()*6,active:false})}guardian=n%4===0?{x:exit.x,y:exit.y,seq:Array.from({length:4},function(){return Math.floor(rr()*4)}),progress:0,phase:0,active:false}:null;player={x:1,y:1,hp:3+s.up.heart,shards:0,cd:0,inv:0,pulse:0};time=0;s.screen='playing';s.paused=false;reveal();hud();save();$('objective').innerHTML=guardian?'<strong>Prueba:</strong> reúne las luces y resuelve el sello del guardián.':'<strong>Objetivo:</strong> reúne 3 fragmentos y encuentra la salida.';toast(biomes[Math.floor((n-1)/4)].name+' · Nivel '+n);sound(450,.15)}
function reveal(){for(var y=0;y<R;y++)for(var x=0;x<C;x++)if(Math.abs(x-player.x)+Math.abs(y-player.y)<=5)seen[y][x]=true}
function open(x,y){return x>=0&&y>=0&&x<C&&y<R&&map[y][x]===0}
function hit(){if(player.inv>0)return;player.hp--;player.inv=1.2;player.x=1;player.y=1;reveal();toast('La sombra te devuelve al inicio');sound(110,.16);hud();if(player.hp<=0)gameOver()}
function cell(){var it=items.find(function(v){return v.x===player.x&&v.y===player.y});if(it){items=items.filter(function(v){return v!==it});if(it.type==='shard'){player.shards++;s.score+=120;toast('✧ Fragmento de luz recogido')}if(it.type==='heart'){player.hp=Math.min(3+s.up.heart,player.hp+1);toast('♡ Energía restaurada')}if(it.type==='spark'){s.up.step=Math.min(4,s.up.step+1);toast('✦ Tus pasos son más ágiles')}sound(720,.1);hud();save()}foes.forEach(function(e){if(e.x===player.x&&e.y===player.y)hit()});traps.forEach(function(t){if(t.active&&t.x===player.x&&t.y===player.y)hit()});if(player.x===exit.x&&player.y===exit.y){if(player.shards<3){toast('Te faltan '+(3-player.shards)+' fragmentos');return}if(guardian){sealIntro();return}finish()}}
function move(dx,dy){if(s.screen!=='playing'||s.paused||player.cd>0)return;var x=player.x+dx,y=player.y+dy;if(open(x,y)){player.x=x;player.y=y;player.cd=Math.max(.09,.15-s.up.step*.012);reveal();cell()}else player.cd=.07}
function pulse(){if(s.screen!=='playing'||s.paused||player.pulse>0)return;player.pulse=3.2-s.up.pulse*.3;foes.forEach(function(e){if(Math.abs(e.x-player.x)+Math.abs(e.y-player.y)<=5)e.stun=1.6});for(var y=0;y<R;y++)for(var x=0;x<C;x++)if(Math.abs(x-player.x)+Math.abs(y-player.y)<=7)seen[y][x]=true;particles.push({x:player.x,y:player.y,life:.65});sound(560,.18)}
function stepEnemy(e){var q=[[e.x,e.y]],prev=new Map(),key=function(x,y){return x+','+y};prev.set(key(e.x,e.y),null);for(var i=0;i<q.length&&i<120;i++){var p=q[i];if(p[0]===player.x&&p[1]===player.y)break;for(var v of [[0,-1],[1,0],[0,1],[-1,0]]){var x=p[0]+v[0],y=p[1]+v[1],k=key(x,y);if(open(x,y)&&!prev.has(k)){prev.set(k,key(p[0],p[1]));q.push([x,y])}}}var cur=key(player.x,player.y),parent=prev.get(cur);while(parent&&parent!==key(e.x,e.y)){cur=parent;parent=prev.get(cur)}if(parent===key(e.x,e.y)){var a=cur.split(',').map(Number);e.x=a[0];e.y=a[1]}}
function update(dt){if(s.screen!=='playing'||s.paused)return;time+=dt;player.cd=Math.max(0,player.cd-dt);player.inv=Math.max(0,player.inv-dt);player.pulse=Math.max(0,player.pulse-dt);foes.forEach(function(e){e.stun=Math.max(0,e.stun-dt);e.cd-=dt;if(e.stun<=0&&e.cd<=0){stepEnemy(e);e.cd=e.speed*(.85+Math.random()*.3);if(e.x===player.x&&e.y===player.y)hit()}});traps.forEach(function(t){t.phase+=dt;t.active=Math.sin(t.phase*2.1)>.62;if(t.active&&t.x===player.x&&t.y===player.y)hit()});if(guardian){guardian.phase+=dt;if(Math.floor(guardian.phase/3)%2===1&&Math.abs(guardian.x-player.x)+Math.abs(guardian.y-player.y)<=2)hit()}if(keys.ArrowUp||keys.w||keys.W)move(0,-1);else if(keys.ArrowDown||keys.s||keys.S)move(0,1);else if(keys.ArrowLeft||keys.a||keys.A)move(-1,0);else if(keys.ArrowRight||keys.d||keys.D)move(1,0)}
function finish(){s.score+=500+player.hp*80+Math.max(0,120-Math.floor(time))*2;s.total+=player.shards;s.best=Math.max(s.best,s.score);save();hud();if(s.level===12){s.screen='victory';showVictory()}else{s.screen='between';dialog('<div class="eyebrow">NIVEL COMPLETADO</div><h1>Una nueva puerta se abre.</h1><p>'+biomes[Math.floor((s.level-1)/4)].desc+' Has encontrado el camino a otra cámara. Tu progreso se guarda automáticamente.</p><div class="features"><div class="feature"><b>+'+(500+player.hp*80)+'</b>Puntos de exploración</div><div class="feature"><b>'+s.total+'</b>Fragmentos reunidos</div></div><div class="actions"><button class="primary" id="next">Descender al nivel '+(s.level+1)+' →</button><button id="levels">Ver niveles</button></div>');$('next').onclick=function(){newLevel(s.level+1)};$('levels').onclick=levelMenu}}
function gameOver(){s.best=Math.max(s.best,s.score);save();s.screen='over';dialog('<div class="eyebrow">FIN DE LA EXPEDICIÓN</div><h1>La cripta te espera otra vez.</h1><p>Has llegado al nivel '+s.level+'. Tus marcas y mejoras permanecen guardadas.</p><div class="features"><div class="feature"><b>'+s.score.toLocaleString('es')+'</b>Puntuación</div><div class="feature"><b>'+s.best.toLocaleString('es')+'</b>Mejor récord</div></div><div class="actions"><button class="primary" id="retry">Reintentar nivel</button><button id="home">Inicio</button></div>');$('retry').onclick=function(){newLevel(s.level)};$('home').onclick=title}
function sealIntro(){s.screen='seal';dialog('<div class="eyebrow">GUARDIÁN DEL UMBRAL</div><h1>El sello de las cuatro luces</h1><p>El guardián protege la salida con una secuencia. Observa los cuatro símbolos y repítelos en el mismo orden.</p><div style="display:flex;justify-content:center;gap:8px;font-size:24px;margin:18px">'+guardian.seq.map(function(v){return '<span style="padding:10px;background:#10182a;border-radius:10px">'+['☼','✦','◈','❋'][v]+'</span>'}).join('')+'</div><div class="actions"><button class="primary" id="begin">Comenzar prueba</button><button id="back">Volver</button></div>');$('begin').onclick=sealPlay;$('back').onclick=function(){s.screen='playing';hide()}}
function sealPlay(){guardian.active=true;guardian.progress=0;s.screen='playing';dialog('<div class="eyebrow" id="sealhead">PRUEBA · 0/4</div><h1>Repite la secuencia</h1><p>Memoriza el orden y toca cada símbolo. Si te equivocas, vuelves a empezar.</p><div style="display:flex;justify-content:center;gap:8px;margin:15px 0">'+guardian.seq.map(function(v){return '<span style="font-size:22px;padding:9px;background:#10182a;border-radius:10px">'+['☼','✦','◈','❋'][v]+'</span>'}).join('')+'</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">'+['☼','✦','◈','❋'].map(function(v,i){return '<button data-rune="'+i+'" style="font-size:22px;padding:13px 3px">'+v+'</button>'}).join('')+'</div><p id="sealprogress">0 / 4 correctos</p><div class="actions"><button id="leave">Salir de la prueba</button></div>');$('leave').onclick=function(){guardian.active=false;guardian.progress=0;s.screen='playing';hide()}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-rune]');if(!b||s.screen!=='playing'||!guardian||!guardian.active)return;var v=+b.dataset.rune;if(v===guardian.seq[guardian.progress]){guardian.progress++;sound(500+guardian.progress*90,.1);if(guardian.progress===4){guardian=null;s.score+=800;toast('Sello restaurado · +800 puntos');finish()}else{$('sealprogress').textContent=guardian.progress+' / 4 correctos';$('sealhead').textContent='PRUEBA · '+guardian.progress+'/4'}}else{guardian.progress=0;$('sealprogress').textContent='0 / 4 correctos';$('sealhead').textContent='PRUEBA · 0/4';toast('Orden incorrecto. Prueba otra vez.')}})
function levelMenu(){s.screen='menu';dialog('<div class="eyebrow">CÁMARA DE VIAJE</div><h1>Elige tu profundidad</h1><p>Los niveles que ya descubriste están disponibles.</p><div class="levels">'+Array.from({length:12},function(_,i){return '<button class="level" data-level="'+(i+1)+'" '+(i+1>s.unlocked?'disabled':'')+'><b>'+String(i+1).padStart(2,'0')+'</b>'+(i%4===3?'✧ Sello':i<4?'Ámbar':i<8?'Cristal':'Vacío')+'</button>'}).join('')+'</div><div class="actions"><button id="return">Volver</button></div>');document.querySelectorAll('[data-level]').forEach(function(b){b.onclick=function(){newLevel(+b.dataset.level)}});$('return').onclick=title}
function title(){s.screen='title';dialog('<div class="eyebrow">AVENTURA ARCADE DE EXPLORACIÓN</div><h1>Ecos de<br><span style="color:var(--gold)">Aether</span></h1><p>Doce niveles bajo una ciudad olvidada. Reúne fragmentos de luz, descifra cámaras secretas y evita a los guardianes que protegen cada región. Cada laberinto se genera de nuevo.</p><div class="features"><div class="feature"><b>12 niveles</b>Tres regiones y cámaras especiales</div><div class="feature"><b>Explora y resuelve</b>Laberintos, sellos y rutas ocultas</div><div class="feature"><b>Mejoras persistentes</b>Agilidad, pulso y resistencia</div><div class="feature"><b>Hecho para móvil</b>Controles táctiles y teclado</div></div><div class="actions"><button class="primary" id="play">Comenzar aventura →</button><button id="choose">Niveles</button><button id="reset">Reiniciar progreso</button></div><p style="font-size:10px;color:#8995b5">El avance se guarda en el dispositivo y en LuminaBook.</p>');$('play').onclick=function(){newLevel(s.level)};$('choose').onclick=levelMenu;$('reset').onclick=function(){if(confirm('¿Reiniciar todo el progreso?')){s.level=1;s.score=0;s.best=0;s.unlocked=1;s.total=0;s.up={step:0,pulse:0,heart:0};save();title()}}}
function pause(){s.paused=true;dialog('<div class="eyebrow">EXPEDICIÓN EN PAUSA</div><h1>La cripta espera.</h1><p>Nivel '+s.level+' · '+s.score+' puntos</p><div class="actions"><button class="primary" id="resume">Continuar</button><button id="restart">Reiniciar nivel</button><button id="exit">Salir al inicio</button></div>');$('resume').onclick=function(){s.paused=false;hide()};$('restart').onclick=function(){newLevel(s.level)};$('exit').onclick=function(){s.paused=false;title()}}
function victory(){s.screen='victory';showVictory()}
function showVictory(){dialog('<div class="eyebrow">FINAL · LAS DOCE LUCES</div><h1>La cripta vuelve a brillar.</h1><p>Has recorrido las tres regiones y devuelto la luz al corazón de Aether. La historia termina, pero tu récord puede seguir creciendo.</p><div class="features"><div class="feature"><b>'+s.score.toLocaleString('es')+'</b>Puntuación final</div><div class="feature"><b>'+s.total+'</b>Fragmentos reunidos</div></div><div class="actions"><button class="primary" id="again">Nueva expedición</button><button id="levels">Ver niveles</button></div>');$('again').onclick=function(){s.score=0;newLevel(1)};$('levels').onclick=levelMenu}
function draw(){c.clearRect(0,0,W,H);var b=biomes[Math.floor((s.level-1)/4)]||biomes[0],g=c.createRadialGradient(450,300,20,450,300,560);g.addColorStop(0,b.floor);g.addColorStop(1,'#070a13');c.fillStyle=g;c.fillRect(0,0,W,H);for(var y=0;y<R;y++)for(var x=0;x<C;x++){var px=OX+x*T,py=OY+y*T;if(!seen[y][x]){c.fillStyle='#080b16';c.fillRect(px,py,T,T);continue}c.fillStyle=map[y][x]?b.wall:((x+y)%2?'#20283a':'#1c2435');c.fillRect(px,py,T,T);if(map[y][x]){c.fillStyle='#ffffff0b';c.fillRect(px+2,py+2,T-4,3)}}if(seen[exit.y][exit.x]){c.save();c.shadowBlur=18;c.shadowColor=b.glow;c.fillStyle=player.shards===3?b.glow:'#6e7891';c.beginPath();c.arc(OX+exit.x*T+17,OY+exit.y*T+17,11+Math.sin(time*3)*2,0,7);c.fill();c.restore()}items.forEach(function(it){if(!seen[it.y][it.x])return;var x=OX+it.x*T+17,y=OY+it.y*T+17;c.save();c.shadowBlur=14;c.shadowColor=it.type==='heart'?'#ff91b6':'#ffe28a';c.fillStyle=it.type==='heart'?'#ff91b6':it.type==='spark'?'#7de5ee':'#ffdb79';c.beginPath();if(it.type==='heart')c.arc(x,y,8,0,7);else{c.moveTo(x,y-10);c.lineTo(x+8,y);c.lineTo(x,y+10);c.lineTo(x-8,y);c.closePath()}c.fill();c.restore()});traps.forEach(function(t){if(!seen[t.y][t.x])return;c.globalAlpha=t.active?.85:.3;c.fillStyle=t.active?'#fa8b8b':'#65708a';c.beginPath();c.arc(OX+t.x*T+17,OY+t.y*T+17,7,0,7);c.fill();c.globalAlpha=1});foes.forEach(function(e){if(!seen[e.y][e.x])return;c.save();c.shadowBlur=14;c.shadowColor=e.stun?'#7debe2':'#b28bff';c.fillStyle=e.stun?'#8ef5e9':'#9d85d4';c.beginPath();c.arc(OX+e.x*T+17,OY+e.y*T+17,11,0,7);c.fill();c.fillStyle='#1b1930';c.fillRect(OX+e.x*T+12,OY+e.y*T+15,3,3);c.fillRect(OX+e.x*T+20,OY+e.y*T+15,3,3);c.restore()});if(guardian&&seen[guardian.y][guardian.x]){c.strokeStyle='#d2b4ff';c.lineWidth=3;c.beginPath();c.arc(OX+guardian.x*T+17,OY+guardian.y*T+17,14+Math.sin(time*3)*3,0,7);c.stroke()}var px=OX+player.x*T+17,py=OY+player.y*T+17;c.save();if(player.inv>0&&Math.floor(time*12)%2===0)c.globalAlpha=.3;c.shadowBlur=18;c.shadowColor='#75e9dc';c.fillStyle='#f3d17b';c.beginPath();c.arc(px,py,10,0,7);c.fill();c.fillStyle='#fff4cf';c.beginPath();c.arc(px-3,py-4,3,0,7);c.fill();c.restore();if(player.pulse>0){c.strokeStyle='rgba(117,233,220,'+(player.pulse/3)+')';c.lineWidth=3;c.beginPath();c.arc(px,py,(3.2-player.pulse)*100,0,7);c.stroke()}particles.forEach(function(p){c.strokeStyle='#8ef5e9';c.globalAlpha=p.life/.65;c.lineWidth=3;c.beginPath();c.arc(OX+p.x*T+17,OY+p.y*T+17,(1-p.life/.65)*140,0,7);c.stroke();c.globalAlpha=1;p.life-=.016});particles=particles.filter(function(p){return p.life>0});if(showMap){c.fillStyle='#080d1ddd';c.fillRect(710,18,175,120);for(var y=0;y<R;y++)for(var x=0;x<C;x++)if(seen[y][x]){c.fillStyle=map[y][x]?'#5d6480':'#b9c8df';c.fillRect(720+x*6,27+y*5.2,5,4)}c.fillStyle='#f7ca6b';c.fillRect(720+player.x*6,27+player.y*5.2,5,5)}}
function loop(now){var dt=Math.min(.04,(now-last)/1000||0);last=now;if(s.screen==='playing'&&!s.paused)update(dt);if(map.length)draw();requestAnimationFrame(loop)}
function bind(btn){var dir=btn.dataset.dir,dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0,timer;function start(e){e.preventDefault();move(dx,dy);timer=setInterval(function(){move(dx,dy)},135)}function stop(){clearInterval(timer)}btn.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(function(ev){btn.addEventListener(ev,stop)})}
document.querySelectorAll('[data-dir]').forEach(bind);$('pulse').addEventListener('pointerdown',function(e){e.preventDefault();pulse()});$('pauseBtn').onclick=function(){if(s.screen==='playing'&&!s.paused)pause();else if(s.paused){s.paused=false;hide()}};$('mapBtn').onclick=function(){showMap=!showMap;toast(showMap?'Mapa activado':'Mapa oculto')};$('soundBtn').onclick=function(){s.muted=!s.muted;$('soundBtn').textContent=s.muted?'🔇':'♫';if(!s.muted){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}sound(550,.1)}};window.addEventListener('lumina:mute',function(e){if(e.detail&&e.detail.muted){s.muted=true;$('soundBtn').textContent='🔇'}else{$('soundBtn').textContent=s.muted?'🔇':'♫'}});$('soundBtn').textContent=s.muted?'🔇':'♫';window.addEventListener('keydown',function(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0)e.preventDefault();keys[e.key]=true;if(e.key==='Escape'&&s.screen==='playing'&&!s.paused)pause();if(e.key===' '&&s.screen==='playing')pulse()});window.addEventListener('keyup',function(e){keys[e.key]=false});document.addEventListener('visibilitychange',function(){if(document.hidden&&s.screen==='playing'&&!s.paused)pause()});
load();title();requestAnimationFrame(loop);
})();
